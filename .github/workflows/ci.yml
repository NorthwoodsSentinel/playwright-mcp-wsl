# CI: the same checks `bun run local:gate` runs, as separate steps so a failure names its stage: format check,
# lint (zero warnings), typecheck, and tests with the 90% per-file coverage bar plus the gate-scope check.
#
# This workflow NEVER deploys or publishes and holds no secret. Tests stub @playwright/mcp and Playwright: no
# browser is installed or launched.
# Actions are pinned to full commit SHAs: a tag can be moved, a SHA cannot.
name: CI

on:
  pull_request:
  push:
    branches: [master]

# Least privilege for GITHUB_TOKEN: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # Hung-job guard, not a flake remedy.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned exactly; the version the gate was measured with.
          bun-version: 1.4.4
      # --ignore-scripts: no dependency lifecycle script runs in CI (nothing here needs one).
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
